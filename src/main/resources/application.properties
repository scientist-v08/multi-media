spring.application.name=v5

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/v5?timezone=Asia/Kolkata&sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=Avaali1$
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional but recommended for Spring Boot 3.5+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Server Configuration
# ===============================
server.port=7898

# ===============================
# Logging (helpful during development)
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ====================== Multipart File Upload ======================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ====================== Media Storage Paths ======================
app.media.storage.video-dir=E:/temp/video-conversion
app.media.storage.image-dir=E:/temp/picture-conversion
